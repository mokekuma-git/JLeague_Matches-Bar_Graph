# Watches J-League matches while they are being played.
#
# Replaces the per-match cron entries that used to start one runner per fixture:
# the setup cost of a run dwarfed the update itself, and every schedule change
# meant hand-editing the workflow.  Each run works out from the CSVs whether
# anything is on and exits straight away when there is not.
name: Live update matches csv

on:
  # Wake-up calls, not appointments.  GitHub starts scheduled runs hours after
  # their slot (#315), so no slot can be trusted to land before a given
  # kick-off, and none has to: which day to watch and when to poll both come
  # from the CSVs.  Slots every two hours from early morning keep some run in
  # reach of the first kick-off even at a five-hour delay.  The odd minute
  # stays clear of the top-of-hour rush that makes the delay worse.
  schedule:
    - cron: '17 20,22 * * *'   # JST 05:17 / 07:17
    - cron: '17 0-12/2 * * *'  # JST 09:17 - 21:17, every two hours
  workflow_dispatch:
    inputs:
      interval:
        description: 'Minutes between polls'
        required: false
        default: '5'

# One watcher at a time; a queued run picks up where the previous one stopped.
# GitHub keeps only the newest queued run and cancels the older one, so on a
# match day some slots end as "cancelled" -- that is the hand-over, not a fault.
concurrency:
  group: live-update-csv
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    # Must stay under the 6h runner cap and above the driver's own budget.
    timeout-minutes: 330

    permissions:
      contents: write
      actions: write

    steps:
      - name: git checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Set git config
        run: |
          git config --global user.name "mokekuma-git"
          git config --global user.email "mokekuma.git@gmail.com"

      # A push made with GITHUB_TOKEN does not start a workflow, so these commits
      # never reach the site on their own: the driver dispatches deploy-pages.yaml
      # itself after every push it lands.  That needs actions:write and a token.
      - name: Watch today's matches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run python scripts/watch_live_matches.py \
            --interval "${{ github.event.inputs.interval || '5' }}" \
            --budget-minutes 300
