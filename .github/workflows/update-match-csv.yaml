name: Update matches csv

on:
  # A manual run carries no schedule, which call_update_csv.sh reads as a full
  # update -- the way to make every reader catch up outside the nightly slot.
  workflow_dispatch:
  schedule:
    # The day's full update.  GitHub starts it hours late, which does no harm;
    # what matters is that it happens once per JST day.  That is decided from a
    # record of the day being done (see "Look up today's full update"), not from
    # the hour or the slot, so the spare slots below only step in when the first
    # one never ran and otherwise exit at once (#315).
    #
    # Slots pinned to a date (the 2025 J-League match ends, WC2026) are gone:
    # cron has no year, so they fired again every season, and finished
    # competitions stay out of the schedule (#321).
    - cron: '0 16 * * *'
    - cron: '17 20 * * *'   # spare, JST 05:17
    - cron: '17 0 * * *'    # spare, JST 09:17

# Runs one at a time, so a spare slot reads the day's record only after the run
# ahead of it has written it.
concurrency:
  group: update-match-csv
  cancel-in-progress: false

jobs:
  update-csv:

    runs-on: ubuntu-latest

    permissions:
      contents: write
      actions: write

    steps:
    - name: git checkout
      uses: actions/checkout@v4
      with:
        ref: main

    - name: Set up uv
      uses: astral-sh/setup-uv@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: uv sync

    - name: Set git config
      run: |
        git config --global user.name "mokekuma-git"
        git config --global user.email "mokekuma.git@gmail.com"

    # The record that today's full update is done lives in the Actions cache,
    # keyed by the JST date, so keeping it adds no commit of its own.  A failed
    # lookup reads as "not done" and only costs a second full update.
    - name: Work out today's JST date
      id: today
      run: echo "day=$(TZ=Asia/Tokyo date +%F)" >> "$GITHUB_OUTPUT"

    - name: Look up today's full update
      id: daily_state
      uses: actions/cache/restore@v4
      with:
        path: .daily-update-done
        key: daily-update-${{ steps.today.outputs.day }}
        lookup-only: true

    - name: Update matches csv
      id: update_csv
      env:
        DAILY_DONE: ${{ steps.daily_state.outputs.cache-hit == 'true' }}
      # The dispatcher runs every reader even when one fails, so a broken source
      # cannot hold the healthy ones back -- but under the default `bash -e` its
      # exit status used to end the step before the commit, throwing their work
      # away too (#322).  Commit what changed first, then fail the step, so the
      # broken source still shows red.
      run: |
        DATE=`TZ=Asia/Tokyo date +'%m/%d %H:%M'`
        STATUS=0
        bash scripts/call_update_csv.sh "${{ github.event.schedule }}" || STATUS=$?
        if (git diff --shortstat | grep '[0-9]'); then \
          git add docs/csv/; \
          git commit -m "Make new csv (append games on $DATE)"; \
          git push origin HEAD; \
          echo "committed=true" >> $GITHUB_OUTPUT; \
        fi
        exit $STATUS

    # A push made with GITHUB_TOKEN starts no workflow, so what was pushed only
    # reaches the site through this dispatch -- even on a run a reader failed.
    - name: Trigger GitHub Pages deploy
      if: ${{ !cancelled() && steps.update_csv.outputs.committed == 'true' }}
      run: gh workflow run deploy-pages.yaml
      env:
        GH_TOKEN: ${{ github.token }}

    # Only a full update with every reader through counts: a failed reader fails
    # the update step, these steps are skipped, and the next slot tries again.
    - name: Mark today's full update as done
      if: steps.update_csv.outputs.trigger == 'Daily'
      run: echo "${{ steps.today.outputs.day }}" > .daily-update-done

    - name: Record today's full update
      if: steps.update_csv.outputs.trigger == 'Daily'
      uses: actions/cache/save@v4
      with:
        path: .daily-update-done
        key: daily-update-${{ steps.today.outputs.day }}
