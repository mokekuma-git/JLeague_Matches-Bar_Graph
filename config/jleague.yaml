debug: false
season: "26-27"

http_timeout: 60
timezone: "Asia/Tokyo"
date_format: "%Y%m%d"
standard_date_format: "%Y/%m/%d"
jleague_date_format: "%Y年%m月%d日"

paths:
  csv_format: "../docs/csv/{season}_allmatch_result-{competition}.csv"
  timestamp_file: "../docs/csv/csv_timestamp.csv"
  season_map_file: "../docs/yaml/season_map.yaml"

urls:
  # J.League official Data Site (SFMS01) search results.
  # Args: competition_years, competition_frame_ids
  # One request returns every section of the season for one competition.
  datasite_url_format: "https://data.j-league.or.jp/SFMS01/search?competition_years={}&competition_frame_ids={}"
  standing_url_format: "https://www.jleague.jp/standings/{}/"

# SFMS01 query/filter values per competition.
# frame_ids -> competition_frame_ids query parameter
# competition_names -> accepted values of the 大会 column (full-width)
datasite:
  frame_ids:
    J1: 1
    J2: 2
    J3: 3
  competition_names:
    J1: ["Ｊ１"]
    J2: ["Ｊ２"]
    J3: ["Ｊ３"]
