debug: false
season: "26-27"

http_timeout: 60
timezone: "Asia/Tokyo"
date_format: "%Y%m%d"
standard_date_format: "%Y/%m/%d"
jleague_date_format: "%Y年%m月%d日"

paths:
  csv_format: "../docs/csv/{season}_allmatch_result-{competition}.csv"
  timestamp_file: "../docs/csv/csv_timestamp.csv"
  season_map_file: "../docs/yaml/season_map.yaml"

urls:
  # Schedule / result pages.  Args: category, start date, end date (ISO).
  # A single request is capped at roughly 200 matches, so the season is fetched
  # one month at a time.  The page mixes in cup and continental fixtures; each
  # card's /match/{category}/... link identifies which competition it belongs to.
  match_url_format: "https://www.jleague.jp/{}/match/?startdate={}&enddate={}&period=custom"
  standing_url_format: "https://www.jleague.jp/standings/{}/"
